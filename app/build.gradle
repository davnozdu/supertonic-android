import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.mozilla.rust-android-gradle.rust-android'
}

configurations {
    onnxRuntime
}

cargo {
    module = "../rust"
    libname = "supertonic_tts"
    targets = ["arm64", "arm", "x86", "x86_64"]
    profile = "release"
    pythonCommand = "python"

    // F-Droid Fix: Robustly find rustc/cargo
    def home = System.getenv("HOME")
    def path = System.getenv("PATH")
    println "DEBUG: HOME=$home"
    println "DEBUG: PATH=$path"
    
    def cargoBin = null
    def rustcBin = null

    // 1. Try resolving from standard locations
    def candidatePaths = [
        "${home}/.cargo/bin",
        "/home/vagrant/.cargo/bin", // Explicit F-Droid path
        "/usr/local/cargo/bin",
        "/usr/bin",
        "/usr/local/bin"
    ]
    
    for (String loc : candidatePaths) {
        def cargo = new File(loc, "cargo")
        def rustc = new File(loc, "rustc")
        if (cargo.exists() && cargoBin == null) cargoBin = cargo.absolutePath
        if (rustc.exists() && rustcBin == null) rustcBin = rustc.absolutePath
    }

    if (cargoBin != null) {
        println "DEBUG: Found cargo at $cargoBin"
        cargoCommand = cargoBin
    }
    if (rustcBin != null) {
        println "DEBUG: Found rustc at $rustcBin"
        rustcCommand = rustcBin
    }
}

// Task to extract libonnxruntime.so for the Rust build
tasks.register('extractOnnxLib', Copy) {
    from {
        zipTree(configurations.onnxRuntime.singleFile)
    }
    into layout.buildDirectory.dir("onnxruntime")
    include "jni/**/libonnxruntime.so"
}

// Task to manually copy the built Rust library to a location Gradle WILL package
tasks.register('copyRustLibs', Copy) {
    dependsOn 'cargoBuild'
    from layout.buildDirectory.dir("rustJniLibs/android")
    into layout.buildDirectory.dir("finalJniLibs")
}

// Configure cargoBuild task
tasks.configureEach { task ->
    if (task.name.startsWith('cargoBuild')) {
        task.dependsOn extractOnnxLib
        if (task.hasProperty('environment')) {
            task.environment 'ORT_LIB_LOCATION', "${layout.buildDirectory.get().asFile}/onnxruntime/jni"
            task.environment 'ORT_SKIP_DOWNLOAD', '1'
        }
    }
    if (task.name.startsWith('merge') && (task.name.endsWith('NativeLibs') || task.name.endsWith('JniLibFolders'))) {
        task.dependsOn copyRustLibs
    }
}

android {
    namespace 'com.brahmadeo.supertonic.tts'
    compileSdk = 36
    ndkVersion = "29.0.14206865"

    sourceSets {
        main {
            // Overridden in afterEvaluate
        }
    }

    defaultConfig {
        // applicationId is forked so the fork installs side-by-side with the
        // upstream Supertonic TTS APK. The Kotlin/Java namespace above stays
        // unchanged so the JNI signatures in rust/src/lib.rs
        // (Java_com_brahmadeo_supertonic_tts_SupertonicTTS_*) continue to
        // resolve — applicationId and namespace are independent in modern AGP.
        applicationId "com.davnozdu.supertonic.tts.fork"
        minSdk 24
        targetSdk 36
        versionCode 34
        versionName "4.0.0-beta4"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
        }
    }

    // Split the APK by ABI so users download only the native libs for their
    // own architecture. ORT alone is ~30 MB per ABI, so a universal APK
    // packs ~120 MB of native code that any given device only uses 25% of.
    // Per-ABI builds:
    //   arm64-v8a       — modern phones (most users)
    //   armeabi-v7a     — older 32-bit ARM, rare
    //   x86 / x86_64    — emulators, Chrome OS
    //   universal       — fat fallback for users who don't know their arch
    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
            universalApk true
        }
    }

    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'androidx.core' && details.requested.name != 'core-viewtree') {
                details.useVersion '1.18.0'
            }
            if (details.requested.group == 'androidx.lifecycle') {
                details.useVersion '2.8.4'
            }
        }
    }
    
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose = true
        aidl = true
        buildConfig = true
    }
    
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
            pickFirst '**/libonnxruntime.so'
            pickFirst '**/libsupertonic_tts.so'
            pickFirst '**/libLiteRt.so'
            pickFirst '**/libLiteRtClGlAccelerator.so'
            pickFirst '**/libc++_shared.so'
        }
    }
}

afterEvaluate {
    android.sourceSets.main.jniLibs.setSrcDirs(["src/main/jniLibs", layout.buildDirectory.dir("finalJniLibs").get().asFile.absolutePath])
}

kotlin {
    compilerOptions {
        jvmTarget.set(JvmTarget.JVM_17)
        freeCompilerArgs.addAll(
            "-opt-in=androidx.compose.material3.ExperimentalMaterial3Api",
        )
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.media:media:1.8.0'

    // Compose Bridge & Material 3 Expressive
    def composeBom = platform('androidx.compose:compose-bom:2026.05.00')
    implementation composeBom
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3:1.4.0'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.26.0'
    onnxRuntime 'com.microsoft.onnxruntime:onnxruntime-android:1.26.0'

    // LiteRT (TensorFlow Lite rebrand) for running INT4 .tflite assets on Android.
    // Iteration 1: only verify the AAR drops into the build cleanly alongside ORT.
    // Pipeline integration arrives in a later iteration.
    implementation 'com.google.ai.edge.litert:litert:2.1.5'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}
