name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name for the release (e.g. v3.0.1)'
        required: true

jobs:
  build:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate release tag
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9][A-Za-z0-9._-]*$ ]] || exit 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - name: Configure local.properties
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
          echo "ndk.dir=${{ steps.setup-ndk.outputs.ndk-path }}" >> local.properties

      - name: Add NDK toolchain to PATH
        run: |
          echo "${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Configure cargo linkers for Android targets
        run: |
          mkdir -p rust/.cargo
          cat <<'EOF' > rust/.cargo/config.toml
          [target.aarch64-linux-android]
          linker = "aarch64-linux-android34-clang"
          [target.armv7-linux-androideabi]
          linker = "armv7a-linux-androideabi34-clang"
          [target.i686-linux-android]
          linker = "i686-linux-android34-clang"
          [target.x86_64-linux-android]
          linker = "x86_64-linux-android34-clang"
          EOF

      - name: Prepare pinned Silero runtime
        run: python3 tools/prepare_silero_runtime.py

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Verify and build release APK
        run: ./gradlew testReleaseUnitTest assembleRelease --stacktrace

      - name: Verify LiteRT-LM JNI names after R8
        run: python3 tools/verify_jni_mapping.py app/build/outputs/mapping/release/mapping.txt

      - name: Prepare signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "Stable signing secrets are required for release builds" >&2
            exit 1
          fi
          # Stable PKCS12 keystore from repository secrets — every release
          # carries the same signature, so users update in place.
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "path=$RUNNER_TEMP/release.p12" >> "$GITHUB_OUTPUT"
          echo "type=PKCS12" >> "$GITHUB_OUTPUT"
          echo "alias=${KEY_ALIAS:-supertonic}" >> "$GITHUB_OUTPUT"
          echo "storepass=$KEYSTORE_PASSWORD" >> "$GITHUB_OUTPUT"
          echo "keypass=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" >> "$GITHUB_OUTPUT"

      - name: Locate Android build-tools
        id: buildtools
        run: |
          BT_DIR=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -n1)
          echo "Using build-tools: $BT_DIR"
          echo "path=$BT_DIR" >> "$GITHUB_OUTPUT"

      - name: Sign all release APKs
        # AGP emits one APK per ABI plus a universal fallback. We sign each
        # one independently and rename it `Supertonic-<tag>-<abi>.apk` so
        # users can pick their architecture from the GitHub Releases page.
        run: |
          TAG="$RELEASE_TAG"
          RELEASE_DIR="app/build/outputs/apk/release"
          OUT_DIR="$RELEASE_DIR/signed"
          mkdir -p "$OUT_DIR"
          for UNSIGNED in "$RELEASE_DIR"/*-unsigned.apk; do
            BASENAME=$(basename "$UNSIGNED")
            # Strip "app-" prefix and "-release-unsigned.apk" suffix → ABI label.
            ABI="${BASENAME#app-}"
            ABI="${ABI%-release-unsigned.apk}"
            ALIGNED="$RELEASE_DIR/${BASENAME%.apk}-aligned.apk"
            SIGNED="$OUT_DIR/Supertonic-${TAG}-${ABI}.apk"
            "${{ steps.buildtools.outputs.path }}/zipalign" -v -p 4 "$UNSIGNED" "$ALIGNED"
            "${{ steps.buildtools.outputs.path }}/apksigner" sign \
              --ks "${{ steps.keystore.outputs.path }}" \
              --ks-type "${{ steps.keystore.outputs.type }}" \
              --ks-key-alias "${{ steps.keystore.outputs.alias }}" \
              --ks-pass "pass:${{ steps.keystore.outputs.storepass }}" \
              --key-pass "pass:${{ steps.keystore.outputs.keypass }}" \
              --out "$SIGNED" \
              "$ALIGNED"
            "${{ steps.buildtools.outputs.path }}/apksigner" verify --verbose "$SIGNED"
          done
          ls -la "$OUT_DIR"
          echo "SIGNED_DIR=$OUT_DIR" >> "$GITHUB_ENV"

      - name: Upload signed APKs as artifact
        uses: actions/upload-artifact@v5
        with:
          name: Supertonic-${{ env.RELEASE_TAG }}
          path: ${{ env.SIGNED_DIR }}/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ${{ env.SIGNED_DIR }}/*.apk
          generate_release_notes: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-beta') }}
          body: |
            **Supertonic TTS for Android** — TeraTTSv2 for Russian and Supertonic 3 for other languages.

            ### Beta 11 changes
            - LLM toggles and idle-time selections save immediately.
            - Stopped/flushed preparation no longer starts a fallback model. Cancellation covers active fragments already removed after a reading timeout.
            - Valid LLM fragments are delivered immediately even if a neighbour needs another provider. Completed results remain available while invalid fragments use fallback.
            - Queue observation and idle checks no longer decrypt API keys.
            - Reject detached stress marks; retain explicit stress syntax and arithmetic plus signs.
            - Tera preserves common Russian abbreviations and initials when inserting pauses; spaced hyphens also create a pause.
            - Release CI verifies the LiteRT-LM JNI getter names after R8. Manual release builds check out and publish the requested tag.
            - Local-model downloads support notification channels only on Android 8+ and respect cancellation before publishing the verified file.

            ### Beta 10 changes
            - Fix a native local-Gemma crash in signed builds: preserve the LiteRT-LM configuration methods called through JNI. A crash previously disconnected Moon+ Reader from the TTS engine.

            ### Beta 9 changes
            - Cloud model refresh shows progress/results beside its button and opens the current list. Ollama Cloud's public catalogue loads without an API key; configured private endpoints still use their key.
            - Tested recommendations are highlighted in the dynamically fetched list. Gemini 3.1 Flash Lite and DeepSeek v4.1 Flash are fast choices; Mistral Large 3 is a slower alternative.
            - Tera inserts only missing punctuation silence: comma 180 ms and sentence end 420 ms by default, with adjustable settings and an off switch. Decimal numbers, dates and clock times retain their numeric boundaries.
            - Reading waits at most 1.5 seconds for unfinished LLM preparation, then continues with dictionary processing while future queued text is prepared.
            - Local Gemma uses JSON-constrained output. The text test reports provider errors instead of silently hiding fallback.
            - Benchmark report and synthetic results are included in the repository; local Gemma E2B requires separate device verification.

            ### Earlier beta changes
            - Optional LLM text preparation: contextual Russian stress and punctuation, with validation that words and numbers are unchanged.
            - Separate thinking switches for Ollama, Gemini and local Gemma are off by default. Where a provider cannot disable thinking completely, settings explain the minimum-level limitation.
            - Strict preparation changes only punctuation and stress; words, digits, quotes and paragraph boundaries are protected. Russian integers and decimal fractions are read as complete numbers, including numbers next to punctuation and grouped thousands.
            - Ollama and Gemini API keys can be entered in the new LLM settings. Available cloud models are fetched from each provider's API; none are hardcoded.
            - Download and verify Gemma 4 E2B from Hugging Face for offline preparation. GPU with CPU fallback; the model is unloaded from RAM after configurable idle time.
            - Auto tries configured clouds, then the downloaded local model. Local mode never contacts clouds; the master switch completely disables LLM preparation.
            - Background preparation observes text already queued by Android TTS clients. Unsent future text cannot be fetched from arbitrary readers.
            - LLM is disabled by default. First use of local preparation can take time to load the model; dictionary fallback keeps reading available on failure.
            - The dictionary no longer forces an arbitrary stress for 19,741 Russian homographs or ambiguous е/ё substitutions. Explicit user stress rules still take priority.
            - TeraTTSv2 is recommended for Russian. Commas and sentence punctuation are preserved when text is split for synthesis.
            - The Russian stress index downloads prebuilt from `davnozdu/supertonic-dictionaries`. New installs no longer build the index on the phone.
            - Russian voice styles and stress marking remain available offline after the first download.
            - The app downloads new signed releases from GitHub, verifies their SHA-256 digest, and opens Android's installer automatically. Android may request permission for installs from this source.
            - Release builds require the permanent signing key; CI fails if it is missing.

            ### Which APK to download
            - **`Supertonic-<tag>-arm64-v8a.apk`** — modern phones (recommended for almost everyone). Smallest download.
            - `Supertonic-<tag>-armeabi-v7a.apk` — older 32-bit ARM phones.
            - `Supertonic-<tag>-x86_64.apk` / `Supertonic-<tag>-x86.apk` — emulators, Chrome OS.
            - `Supertonic-<tag>-universal.apk` — fat fallback if you're not sure. ~2× larger than the per-ABI ones.

            ### Install
            1. Download the right APK above (arm64-v8a in 99% of cases).
            2. On the phone: Settings → Apps → Install unknown apps → allow your file manager / browser.
            3. Tap the APK to install. If `adb install` returns `INSTALL_FAILED_VERIFICATION_FAILURE`, disable `Verify apps over USB` in Developer Options.
            4. First use downloads the selected model. TeraTTSv2 fetches its ONNX files from Hugging Face and the ready-to-use stress index from GitHub.

            ### Make it the system TTS
            Settings → Accessibility → Text-to-speech output → Preferred engine → **Supertonic TTS (Fork)**.

            ### Note on signing
            Releases are signed with a **stable keystore** (repository secrets `KEYSTORE_BASE64`, `KEY_ALIAS`, `KEYSTORE_PASSWORD`, `KEY_PASSWORD`), so updates install in place. Versions up to and including v4.0.0-beta3 were signed with ephemeral per-build keys — upgrading from those requires uninstalling once.
