name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name for the release (e.g. v3.0.1)'
        required: true

jobs:
  build:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - name: Configure local.properties
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
          echo "ndk.dir=${{ steps.setup-ndk.outputs.ndk-path }}" >> local.properties

      - name: Add NDK toolchain to PATH
        run: |
          echo "${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Configure cargo linkers for Android targets
        run: |
          mkdir -p rust/.cargo
          cat <<'EOF' > rust/.cargo/config.toml
          [target.aarch64-linux-android]
          linker = "aarch64-linux-android34-clang"
          [target.armv7-linux-androideabi]
          linker = "armv7a-linux-androideabi34-clang"
          [target.i686-linux-android]
          linker = "i686-linux-android34-clang"
          [target.x86_64-linux-android]
          linker = "x86_64-linux-android34-clang"
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build unsigned release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Generate signing keystore
        id: keystore
        run: |
          # CI signs every build with an ephemeral RSA-4096 key. Side-effect:
          # users updating from one release to the next must uninstall first
          # (a Play Store / F-Droid pipeline with a stable key would avoid this).
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/release.jks" \
            -storetype JKS \
            -alias supertonic \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -storepass supertonic-ci \
            -keypass supertonic-ci \
            -dname "CN=Supertonic v3 fork, OU=davnozdu, O=davnozdu, L=NA, S=NA, C=NA"
          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Locate Android build-tools
        id: buildtools
        run: |
          BT_DIR=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -n1)
          echo "Using build-tools: $BT_DIR"
          echo "path=$BT_DIR" >> "$GITHUB_OUTPUT"

      - name: Sign all release APKs
        # AGP emits one APK per ABI plus a universal fallback. We sign each
        # one independently and rename it `Supertonic-<tag>-<abi>.apk` so
        # users can pick their architecture from the GitHub Releases page.
        run: |
          TAG="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          RELEASE_DIR="app/build/outputs/apk/release"
          OUT_DIR="$RELEASE_DIR/signed"
          mkdir -p "$OUT_DIR"
          for UNSIGNED in "$RELEASE_DIR"/*-unsigned.apk; do
            BASENAME=$(basename "$UNSIGNED")
            # Strip "app-" prefix and "-release-unsigned.apk" suffix → ABI label.
            ABI="${BASENAME#app-}"
            ABI="${ABI%-release-unsigned.apk}"
            ALIGNED="$RELEASE_DIR/${BASENAME%.apk}-aligned.apk"
            SIGNED="$OUT_DIR/Supertonic-${TAG}-${ABI}.apk"
            "${{ steps.buildtools.outputs.path }}/zipalign" -v -p 4 "$UNSIGNED" "$ALIGNED"
            "${{ steps.buildtools.outputs.path }}/apksigner" sign \
              --ks "${{ steps.keystore.outputs.path }}" \
              --ks-key-alias supertonic \
              --ks-pass pass:supertonic-ci \
              --key-pass pass:supertonic-ci \
              --out "$SIGNED" \
              "$ALIGNED"
            "${{ steps.buildtools.outputs.path }}/apksigner" verify --verbose "$SIGNED"
          done
          ls -la "$OUT_DIR"
          echo "SIGNED_DIR=$OUT_DIR" >> "$GITHUB_ENV"

      - name: Upload signed APKs as artifact
        uses: actions/upload-artifact@v5
        with:
          name: Supertonic-${{ github.ref_name }}
          path: ${{ env.SIGNED_DIR }}/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.SIGNED_DIR }}/*.apk
          generate_release_notes: true
          body: |
            **Supertonic 3 multilingual TTS for Android** — 31-language fork of `DevGitPit/supertonic-android`.

            ### Which APK to download
            - **`Supertonic-<tag>-arm64-v8a.apk`** — modern phones (recommended for almost everyone). Smallest download.
            - `Supertonic-<tag>-armeabi-v7a.apk` — older 32-bit ARM phones.
            - `Supertonic-<tag>-x86_64.apk` / `Supertonic-<tag>-x86.apk` — emulators, Chrome OS.
            - `Supertonic-<tag>-universal.apk` — fat fallback if you're not sure. ~2× larger than the per-ABI ones.

            ### Install
            1. Download the right APK above (arm64-v8a in 99% of cases).
            2. On the phone: Settings → Apps → Install unknown apps → allow your file manager / browser.
            3. Tap the APK to install. If `adb install` returns `INSTALL_FAILED_VERIFICATION_FAILURE`, disable `Verify apps over USB` in Developer Options.
            4. First launch downloads ~400 MB of ONNX models from Hugging Face — needs Wi-Fi once.

            ### Make it the system TTS
            Settings → Accessibility → Text-to-speech output → Preferred engine → **Supertonic TTS (Fork)**.

            ### Note on signing
            This release is signed with an **ephemeral CI keystore** that changes every build. To upgrade you must uninstall the previous version first. For long-term distribution, configure a stable keystore via repository secrets `KEYSTORE_BASE64`, `KEY_ALIAS`, `KEYSTORE_PASSWORD`, `KEY_PASSWORD`.
