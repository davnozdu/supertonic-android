name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name for the release (e.g. v3.0.1)'
        required: true

jobs:
  build:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate release tag
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9][A-Za-z0-9._-]*$ ]] || exit 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - name: Configure local.properties
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
          echo "ndk.dir=${{ steps.setup-ndk.outputs.ndk-path }}" >> local.properties

      - name: Add NDK toolchain to PATH
        run: |
          echo "${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Configure cargo linkers for Android targets
        run: |
          mkdir -p rust/.cargo
          cat <<'EOF' > rust/.cargo/config.toml
          [target.aarch64-linux-android]
          linker = "aarch64-linux-android34-clang"
          [target.armv7-linux-androideabi]
          linker = "armv7a-linux-androideabi34-clang"
          [target.i686-linux-android]
          linker = "i686-linux-android34-clang"
          [target.x86_64-linux-android]
          linker = "x86_64-linux-android34-clang"
          EOF

      - name: Prepare pinned Silero runtime
        run: python3 tools/prepare_silero_runtime.py

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build PocketTTS ARM64 runtime
        run: bash tools/prepare_pocket_runtime.sh


      - name: Verify and build release APK
        run: ./gradlew testReleaseUnitTest assembleRelease --stacktrace

      - name: Verify LiteRT-LM JNI names after R8
        run: python3 tools/verify_jni_mapping.py app/build/outputs/mapping/release/mapping.txt

      - name: Prepare signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "Stable signing secrets are required for release builds" >&2
            exit 1
          fi
          # Stable PKCS12 keystore from repository secrets — every release
          # carries the same signature, so users update in place.
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "path=$RUNNER_TEMP/release.p12" >> "$GITHUB_OUTPUT"
          echo "type=PKCS12" >> "$GITHUB_OUTPUT"
          echo "alias=${KEY_ALIAS:-supertonic}" >> "$GITHUB_OUTPUT"
          echo "storepass=$KEYSTORE_PASSWORD" >> "$GITHUB_OUTPUT"
          echo "keypass=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" >> "$GITHUB_OUTPUT"

      - name: Locate Android build-tools
        id: buildtools
        run: |
          BT_DIR=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -n1)
          echo "Using build-tools: $BT_DIR"
          echo "path=$BT_DIR" >> "$GITHUB_OUTPUT"

      - name: Sign all release APKs
        # AGP emits one APK per ABI plus a universal fallback. We sign each
        # one independently and rename it `Supertonic-<tag>-<abi>.apk` so
        # users can pick their architecture from the GitHub Releases page.
        run: |
          TAG="$RELEASE_TAG"
          RELEASE_DIR="app/build/outputs/apk/release"
          OUT_DIR="$RELEASE_DIR/signed"
          mkdir -p "$OUT_DIR"
          for UNSIGNED in "$RELEASE_DIR"/*-unsigned.apk; do
            BASENAME=$(basename "$UNSIGNED")
            # Strip "app-" prefix and "-release-unsigned.apk" suffix → ABI label.
            ABI="${BASENAME#app-}"
            ABI="${ABI%-release-unsigned.apk}"
            ALIGNED="$RELEASE_DIR/${BASENAME%.apk}-aligned.apk"
            SIGNED="$OUT_DIR/Supertonic-${TAG}-${ABI}.apk"
            "${{ steps.buildtools.outputs.path }}/zipalign" -v -p 4 "$UNSIGNED" "$ALIGNED"
            "${{ steps.buildtools.outputs.path }}/apksigner" sign \
              --ks "${{ steps.keystore.outputs.path }}" \
              --ks-type "${{ steps.keystore.outputs.type }}" \
              --ks-key-alias "${{ steps.keystore.outputs.alias }}" \
              --ks-pass "pass:${{ steps.keystore.outputs.storepass }}" \
              --key-pass "pass:${{ steps.keystore.outputs.keypass }}" \
              --out "$SIGNED" \
              "$ALIGNED"
            "${{ steps.buildtools.outputs.path }}/apksigner" verify --verbose "$SIGNED"
          done
          ls -la "$OUT_DIR"
          echo "SIGNED_DIR=$OUT_DIR" >> "$GITHUB_ENV"

      - name: Upload signed APKs as artifact
        uses: actions/upload-artifact@v5
        with:
          name: Supertonic-${{ env.RELEASE_TAG }}
          path: ${{ env.SIGNED_DIR }}/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ${{ env.SIGNED_DIR }}/*.apk
          draft: true
          generate_release_notes: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-beta') }}
          body_path: .github/release-notes.md

      - name: Publish beta after all APK uploads
        if: contains(env.RELEASE_TAG, '-beta')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_LABEL="${RELEASE_TAG#v}"
          VERSION_LABEL="${VERSION_LABEL%%-beta*}"
          VERSION_LABEL="${VERSION_LABEL%.0}"
          BETA_LABEL="${RELEASE_TAG##*-beta}"
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --title "MyTTS $VERSION_LABEL Beta $BETA_LABEL"
