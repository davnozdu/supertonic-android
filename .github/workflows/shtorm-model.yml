name: Prepare Shtorm model
on:
  push:
    branches: [feature/model-selector]
    paths: [tools/export_shtorm.py, .github/workflows/shtorm-model.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU export dependencies
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ./vendor/pockettts/pocket-tts onnx==1.18.0 onnxruntime==1.22.1 pyyaml
      - name: Export and validate
        run: python tools/export_shtorm.py
      - name: Publish reusable model files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view shtorm-pocket-v2 || gh release create shtorm-pocket-v2 --title 'Shtorm PocketTTS RU v2 — Android model' --notes 'One-time ONNX export. Original model: ArtShtorm/Shtorm_PocketTTS_RU (CC BY 4.0). Native PocketTTS runtime source attribution included in app.' --prerelease
          gh release upload shtorm-pocket-v2 build/shtorm-model/*.onnx build/shtorm-model/*.model build/shtorm-model/alba.wav build/shtorm-model/LICENSE.txt build/shtorm-model/manifest.json --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shtorm-export
          path: build/shtorm-model/
