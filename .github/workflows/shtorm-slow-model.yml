name: Prepare Shtorm slow model
on:
  push:
    branches: [feature/model-selector]
    paths: [.github/workflows/shtorm-slow-model.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU export dependencies
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ./vendor/pockettts/pocket-tts onnx==1.18.0 onnxruntime==1.22.1 pyyaml huggingface_hub safetensors
      - name: Export and validate
        run: python tools/export_shtorm.py slow
      - name: Publish slow model files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view shtorm-pocket-v2-slow || gh release create shtorm-pocket-v2-slow --title 'Shtorm PocketTTS RU v2 slow — Android model' --notes 'One-time ONNX export of model_slow (calmer delivery). Only graphs that differ from shtorm-pocket-v2. Original model: ArtShtorm/Shtorm-PocketTTS-RU (CC BY 4.0).' --prerelease
          gh release upload shtorm-pocket-v2-slow build/shtorm-model-slow/*.onnx build/shtorm-model-slow/LICENSE.txt build/shtorm-model-slow/manifest.json --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shtorm-slow-export
          path: build/shtorm-model-slow/manifest.json
