name: Copy signing secrets to mytts-private (one-off)

# Одноразовый: копирует секреты подписи в приватный репозиторий разработки.
# Значения не печатаются. После успешного запуска файл удаляется.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Copy
        env:
          GH_TOKEN: ${{ secrets.COPY_SECRETS_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          [ -n "$GH_TOKEN" ] || { echo "no token" >&2; exit 1; }
          for N in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            V="${!N}"
            if [ -z "$V" ]; then echo "$N: empty here, skipped"; continue; fi
            printf '%s' "$V" | gh secret set "$N" -R davnozdu/mytts-private
            echo "$N: copied (${#V} chars)"
          done
          gh secret list -R davnozdu/mytts-private
