name: Gemma NPU Probe
on:
  push:
    branches: [experiment/gemma4-npu]
    paths:
      - 'tools/gemma-npu-probe/**'
      - '.github/workflows/gemma-npu-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build independent probe APK
        run: ./gradlew -p tools/gemma-npu-probe assembleDebug --stacktrace
      - name: Sign probe with stable repository certificate
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          export PROBE_KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/gemma-probe-signing.p12"
          "$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/gemma-probe-signing.p12" --ks-type PKCS12 \
            --ks-key-alias "${KEY_ALIAS:-supertonic}" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:PROBE_KEY_PASSWORD \
            tools/gemma-npu-probe/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner" verify \
            tools/gemma-npu-probe/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v5
        with:
          name: gemma-npu-probe-${{ github.sha }}
          path: tools/gemma-npu-probe/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
